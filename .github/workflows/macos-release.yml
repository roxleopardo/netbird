name: macOS Release

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  GORELEASER_VER: "v2.16.0"
  flags: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Client / Unit (macOS)"
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "go.mod"

      - name: Install libpcap
        run: brew install libpcap

      - name: Test the packages touched by the AAAA fix
        run: >-
          CI=true go test -tags 'devcert privileged'
          -exec 'sudo --preserve-env=CI' -timeout 10m -p 1
          ./client/internal/dns/...
          ./client/internal/networkmonitor/...
          ./client/internal/routemanager/systemops/...
          ./shared/relay/client/...

  release:
    name: "Build & Release"
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set snapshot flag
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "flags=--snapshot" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # It is required for GoReleaser to work properly
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "go.mod"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: ${{ env.GORELEASER_VER }}
          args: release --config .goreleaser_macos.yaml --clean ${{ env.flags }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: netbird-darwin
          path: dist/*.tar.gz
          retention-days: 7